name: Validate guide, DPS rankings and patch browser flows
on:
  pull_request:
    paths:
      - 'assets/dps*.js'
      - 'assets/liveops.css'
      - 'assets/patchbook.*'
      - 'assets/news.js'
      - 'patchbook.py'
      - 'data/patch-reviews.json'
      - 'data/skills.json'
      - 'data/dps-resources.json'
      - 'dpsrules.py'
      - 'liveops.py'
      - 'tests/dps*.js'
      - 'tests/patch-ui.test.js'
      - 'tests/post-story-ui.test.js'
      - 'poststory.py'
      - 'guidebrowse.py'
      - 'advancedguides.py'
      - 'assets/advanced-guides.*'
      - 'tests/advanced-guides-ui.test.js'
      - 'servertransfer.py'
      - 'assets/server-transfer.css'
      - 'research/server-transfer-review.json'
      - 'tests/server-transfer-ui.test.js'
      - 'assets/find-guide.*'
      - 'assets/app.js'
      - 'tests/find-guide-ui.test.js'
      - 'progression.py'
      - 'growthvisuals.py'
      - 'assets/growth-visuals.*'
      - 'tests/growth-visuals-ui.test.js'
      - 'assets/progression.css'
      - 'tests/progression-ui.test.js'
      - 'routines.py'
      - 'assets/routines.css'
      - 'tests/routines-ui.test.js'
      - 'gearsteps.py'
      - 'onboarding.py'
      - 'endgame.py'
      - 'worldmap.py'
      - 'assets/deep-guide.js'
      - 'assets/deep-guide.css'
      - 'tests/world-map-ui.test.js'
      - 'visuals.py'
      - 'build.py'
      - 'vakron.py'
      - 'bossmedia.py'
      - 'battlelab.py'
      - 'encounters.py'
      - 'assets/battle.js'
      - 'assets/vakron.*'
      - 'tests/vakron-ui.test.js'
      - 'dpsmath.py'
      - 'dpslevels.py'
      - 'dpsranking.py'
      - 'data/dps-*.json'
      - 'assets/dps-rankings.css'
      - 'scripts/build_dps_rankings.js'
      - 'assets/practical-guide.css'
      - '.github/workflows/dps-browser.yml'
  push:
    branches: [main]
    paths:
      - 'assets/dps*.js'
      - 'assets/liveops.css'
      - 'assets/patchbook.*'
      - 'assets/news.js'
      - 'patchbook.py'
      - 'data/patch-reviews.json'
      - 'dpsrules.py'
      - 'liveops.py'
      - 'tests/post-story-ui.test.js'
      - 'poststory.py'
      - 'guidebrowse.py'
      - 'advancedguides.py'
      - 'assets/advanced-guides.*'
      - 'tests/advanced-guides-ui.test.js'
      - 'servertransfer.py'
      - 'assets/server-transfer.css'
      - 'research/server-transfer-review.json'
      - 'tests/server-transfer-ui.test.js'
      - 'assets/find-guide.*'
      - 'assets/app.js'
      - 'tests/find-guide-ui.test.js'
      - 'progression.py'
      - 'growthvisuals.py'
      - 'assets/growth-visuals.*'
      - 'tests/growth-visuals-ui.test.js'
      - 'assets/progression.css'
      - 'tests/progression-ui.test.js'
      - 'routines.py'
      - 'assets/routines.css'
      - 'tests/routines-ui.test.js'
      - 'gearsteps.py'
      - 'onboarding.py'
      - 'endgame.py'
      - 'worldmap.py'
      - 'assets/deep-guide.js'
      - 'assets/deep-guide.css'
      - 'tests/world-map-ui.test.js'
      - 'visuals.py'
      - 'build.py'
      - 'vakron.py'
      - 'bossmedia.py'
      - 'battlelab.py'
      - 'encounters.py'
      - 'assets/battle.js'
      - 'assets/vakron.*'
      - 'tests/vakron-ui.test.js'
      - 'dpsmath.py'
      - 'dpslevels.py'
      - 'dpsranking.py'
      - 'data/dps-*.json'
      - 'assets/dps-rankings.css'
      - 'scripts/build_dps_rankings.js'
      - 'assets/practical-guide.css'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python build.py
      - name: Install temporary browser test runtime
        run: |
          npm --prefix "$RUNNER_TEMP/dps-qa" install --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/dps-qa/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
      - name: Verify map coverage and empty-region recovery on phones
        run: NODE_PATH="$RUNNER_TEMP/dps-qa/node_modules" node tests/world-map-ui.test.js
      - if: ${{ !cancelled() }}
        name: Verify focused guide navigation, history, mobile menu and no-script fallback
        env:
          FIND_GUIDE_QA_ARTIFACTS: ${{ runner.temp }}/dps-qa-artifacts
        run: NODE_PATH="$RUNNER_TEMP/dps-qa/node_modules" node tests/find-guide-ui.test.js
      - if: ${{ !cancelled() }}
        name: Verify practical guides, reward decisions and raid playback
        env:
          ADVANCED_GUIDE_QA_ARTIFACTS: ${{ runner.temp }}/dps-qa-artifacts
        run: NODE_PATH="$RUNNER_TEMP/dps-qa/node_modules" node tests/advanced-guides-ui.test.js
      - if: ${{ !cancelled() }}
        name: Verify backend-generated rankings, downloads and no-JavaScript display
        env:
          DPS_QA_ARTIFACTS: ${{ runner.temp }}/dps-qa-artifacts
        run: NODE_PATH="$RUNNER_TEMP/dps-qa/node_modules" node tests/dps-ui.test.js
      - if: ${{ !cancelled() }}
        name: Verify summary and full patch pages on desktop and phones
        env:
          PATCH_QA_ARTIFACTS: ${{ runner.temp }}/dps-qa-artifacts
        run: NODE_PATH="$RUNNER_TEMP/dps-qa/node_modules" node tests/patch-ui.test.js
      - if: ${{ !cancelled() }}
        name: Verify post-story routes, saved checks and phone layout
        env:
          POST_STORY_QA_ARTIFACTS: ${{ runner.temp }}/dps-qa-artifacts
        run: NODE_PATH="$RUNNER_TEMP/dps-qa/node_modules" node tests/post-story-ui.test.js
      - if: ${{ !cancelled() }}
        name: Verify daily and weekly rewards, search and no-script mobile layout
        env:
          ROUTINES_QA_ARTIFACTS: ${{ runner.temp }}/dps-qa-artifacts
        run: NODE_PATH="$RUNNER_TEMP/dps-qa/node_modules" node tests/routines-ui.test.js
      - if: ${{ !cancelled() }}
        name: Verify pet, gear, dungeon and Kinah growth routes
        env:
          PROGRESSION_QA_ARTIFACTS: ${{ runner.temp }}/dps-qa-artifacts
        run: NODE_PATH="$RUNNER_TEMP/dps-qa/node_modules" node tests/progression-ui.test.js
      - if: ${{ !cancelled() }}
        name: Verify visual reward routes, slot selector and Kinah allocation
        env:
          GROWTH_VISUAL_QA_ARTIFACTS: ${{ runner.temp }}/dps-qa-artifacts
        run: NODE_PATH="$RUNNER_TEMP/dps-qa/node_modules" node tests/growth-visuals-ui.test.js
      - if: ${{ !cancelled() }}
        name: Verify bilingual Vakron full run on mobile and preserve legacy patterns
        env:
          VAKRON_QA_ARTIFACTS: ${{ runner.temp }}/dps-qa-artifacts
        run: NODE_PATH="$RUNNER_TEMP/dps-qa/node_modules" node tests/vakron-ui.test.js
      - if: ${{ !cancelled() }}
        name: Verify Global transfer preparation, deep links and mobile layout
        env:
          TRANSFER_QA_ARTIFACTS: ${{ runner.temp }}/dps-qa-artifacts
        run: NODE_PATH="$RUNNER_TEMP/dps-qa/node_modules" node tests/server-transfer-ui.test.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edps-browser-evidence
          path: ${{ runner.temp }}/dps-qa-artifacts/
          if-no-files-found: ignore
