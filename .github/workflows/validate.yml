name: Validate PLAYER’S CODEX
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python build.py
      - run: python validate.py
      - run: node --check assets/analytics.js
      - run: node tests/analytics.test.js
      - run: node --check assets/app.js
      - run: node --check assets/explorer.js
      - run: node --check assets/encounters.js
      - run: node --check assets/learn.js
      - run: node --check assets/deep-guide.js
      - run: node --check assets/battle.js
      - run: git diff --exit-code -- docs
