name: Refresh official AION 2 updates
on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
concurrency:
  group: official-news-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect public official feeds
        id: collect
        continue-on-error: true
        run: python scripts/collect_updates.py
      - name: Verify collector, calculation and publication
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node tests/dps.test.js
          node tests/analytics.test.js
          node tests/patchbook.test.js
          node --check assets/patchbook.js
          node --check assets/news.js
          node --check assets/dps.js
          python build.py
          python validate.py
      - name: Commit only the collected snapshot and its generated pages
        id: publish
        run: |
          python scripts/check_news_diff.py
          git add data/news.json docs/data/news.json docs/index.html docs/ko/index.html docs/updates docs/ko/updates docs/search-index.json docs/sitemap.xml
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh official AION 2 announcement snapshot'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Request the existing GitHub Pages build
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # A GITHUB_TOKEN push does not trigger the branch-based Pages build.
        # Explicitly build the existing main /docs publishing source.
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
      - name: Report a source outage after publishing its cached status
        if: steps.collect.outcome == 'failure'
        run: |
          echo '::error::One or more public feeds failed. Last successful items were retained and the outage is marked on the site.'
          exit 1
